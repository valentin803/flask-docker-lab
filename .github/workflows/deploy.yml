name: DevOps Lab - Deploy

on:
  workflow_dispatch: # ce e triggerul asta ? de unde il pornesti ? ce alte triggere mai cunosti (macar 2) ?
  push:
    branches:
      - main # workflow-ul ruleaza si pe un pull request catre main ? cum ai face sa ruleze validarea inainte de merge ?
    paths:
      - "app/**"
      - "ansible/**"
      - "terraform/**"
      - ".github/workflows/deploy.yml"

# ce e GITHUB_TOKEN si cine il creeaza ? ce inseamna least privilege ? ce permisiuni ar avea jobul daca stergi blocul asta ?
permissions:
  contents: read

concurrency:
  group: devops-lab-deploy
  cancel-in-progress: false

# care e diff intre workflow, job si step ? daca ai 2 joburi ruleaza in paralel sau pe rand ? ce face needs ?
# ce e un runner ? ce ramane pe el dupa ce se termina jobul ?
jobs:
  validate:
    name: Validate project
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4 # ce inseamna @v4 ? care e diff intre a fixa un action dupa tag si dupa commit SHA ? care e mai sigur si de ce ?

      # de unde stie github ca un step a picat ? ce e un exit code ? ce se intampla cu pasii urmatori daca primul test -f pica ?
      - name: Check required files
        run: |
          test -f terraform/main.tf
          test -f ansible/playbook.yml
          test -f app/Dockerfile
          test -f app/app.py
          test -f app/requirements.txt

      - name: Confirm project structure
        run: echo "Project files verified successfully."

# workflow-ul se numeste Deploy - cand o sa faca deploy pe bune o sa aiba nevoie de acces la AWS si de cheia SSH
# unde le tii ? ce e un secret in github actions si cine il poate citi ? ce e OIDC si de ce e preferat fata de access keys ?
# descrie in cuvinte pasii unui pipeline complet pentru proiectul asta, de la git push pana la aplicatia noua pe server