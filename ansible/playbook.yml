- name: Configure Ubuntu server, Docker and Nginx # ce e un play si ce e un task ? cate play-uri ai aici ?
  hosts: aws_servers # unde e definit grupul asta ? nu vad inventory in repo, arata-mi-l. cum ajunge ip-ul din terraform in el ?
  become: true # ce face become ? cu ce user intri pe server si cum ? ce trebuie sa existe pe server ca sa mearga ansible ?

  tasks: # in ce ordine ruleaza taskurile ? ce se intampla cu restul daca unul pica ? ce e "Gathering Facts" care apare primul desi nu l-ai scris ?
    - name: Refresh the apt package index
      ansible.builtin.apt: # ce e un modul ? ce inseamna ansible.builtin ? de ce modulul apt si nu command: apt install ?
        update_cache: true # ce comanda ai fi dat de mana in loc de asta ?
        cache_valid_time: 3600 # ce face asta ? ce se intampla daca rulezi playbook-ul de 2 ori in 10 minute ?

    - name: Install basic tools, Docker and Nginx # ce inseamna ca un task e idempotent ? ce vezi la a 2-a rulare - ok sau changed ?
      ansible.builtin.apt:
        name:
          - htop
          - unzip
          - docker.io # care e diff intre docker.io si docker-ce ?
          - nginx
        state: present

    - name: Ensure Docker is running and enabled at startup
      ansible.builtin.service: # care e diff intre modulul service si systemd ?
        name: docker
        state: started # care e diff intre started restarted si reloaded ?
        enabled: true

    - name: Check Docker version
      ansible.builtin.command: docker --version # de ce command si nu shell ? care e diff ? unde vezi outputul comenzii asteia ? ce fac register si debug ?
      changed_when: false # ce face asta ? ce ai vedea in recap daca il stergi ?

    - name: Configure Nginx as a reverse proxy
      ansible.builtin.copy: # de ce copy si nu template ? ce e jinja2 ? cum ai scoate portul 5000 intr-o variabila ?
        dest: /etc/nginx/sites-available/devops-lab
        owner: root
        group: root
        mode: "0644" # ce inseamna 0644 ? de ce e in ghilimele ?
        content: | # ce face | in yaml ? care e diff fata de > ?
          server {
              listen 80 default_server;
              listen [::]:80 default_server;
              server_name _;

              location / {
                  proxy_pass http://127.0.0.1:5000;
                  proxy_http_version 1.1;
                  proxy_set_header Host $host;
                  proxy_set_header X-Real-IP $remote_addr;
                  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto $scheme;
              }
          }
      notify: Restart Nginx # cand ruleaza handlerul - imediat sau la final ? 3 taskuri dau notify, de cate ori ruleaza ? mai ruleaza daca taskul nu a schimbat nimic ?

    - name: Remove the default Nginx site
      ansible.builtin.file: # modulul file sterge, face linkuri, face directoare - de unde stie ce sa faca ?
        path: /etc/nginx/sites-enabled/default
        state: absent # ce se intampla daca fisierul nu exista deja ? da eroare ?
      notify: Restart Nginx

    - name: Enable the DevOps Lab Nginx site
      ansible.builtin.file:
        src: /etc/nginx/sites-available/devops-lab
        dest: /etc/nginx/sites-enabled/devops-lab
        state: link # ce e un symlink ? de ce are nginx si sites-available si sites-enabled ?
      notify: Restart Nginx

    - name: Test the Nginx configuration
      ansible.builtin.command: nginx -t # asta ruleaza inainte sau dupa restart ? daca config-ul e gresit ce se intampla cu nginx ? cum validezi inainte sa scrii fisierul ?
      changed_when: false

    - name: Ensure Nginx is running and enabled at startup # daca nginx e deja pornit ce face taskul asta ?
      ansible.builtin.service:
        name: nginx
        state: started
        enabled: true

  handlers:
    - name: Restart Nginx # ce se intampla daca la notify scrii numele gresit ? de ce restart si nu reload ? care taie conexiunile ?
      ansible.builtin.service:
        name: nginx
        state: restarted

